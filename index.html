<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лешан — 470080</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: Arial, sans-serif;
            color: #ffffff;

            background:
                radial-gradient(circle at 20% 20%, #243b72 0, transparent 35%),
                radial-gradient(circle at 80% 80%, #163b4f 0, transparent 35%),
                #080b12;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 48px;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);

            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .label {
            display: inline-block;
            margin-bottom: 24px;
            padding: 7px 12px;

            border-radius: 999px;
            background: rgba(0, 180, 255, 0.12);
            color: #66d9ff;

            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 52px;
            line-height: 1;
            letter-spacing: -2px;
        }

        .subtitle {
            margin-bottom: 36px;
            color: #9da7b8;
            font-size: 16px;
        }

        .info {
            padding: 20px 22px;

            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
        }

        .info-title {
            margin-bottom: 8px;
            color: #8e98aa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .isu {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 32px;
            color: #667085;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 32px;
            }

            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="label">
            ITMO University
        </div>

        <h1>Лешан</h1>

        <p class="subtitle">
            Web · Recon
        </p>

        <div class="info">
            <div class="info-title">
                ИСУ ID
            </div>

            <div class="isu">
                470080
            </div>
        </div>

        <div class="footer">
            osinthijacking.itmo.xyz
        </div>

    </main>

</body>
</html>
